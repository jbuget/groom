<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des salles</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-authenticated="{{ if .isAuthenticated }}true{{ else }}false{{ end }}">
    <main>
        <div class="header-container">
            <h1>Liste des salles <span id="update-indicator" class="update-indicator"></span></h1>
            {{ if not .isAuthenticated }}
            <a href="/auth/login" class="login-link">Se connecter</a>
            {{ else }}
            <a href="/auth/logout" class="login-link">Se déconnecter</a>
            {{ end }}
        </div>

        <div class="filter-container">
            <input type="search" id="filter-input" class="filter-input" placeholder="Filtrer par nom de la salle..." />
            <button class="filter-reset-btn" id="filter-reset-btn">Réinitialiser</button>
        </div>

        <div class="room-list" {{ if not .allRooms }}style="display: none"{{ end }}>
            <ul>
                {{ range .allRooms }}
                <li>
                    <div class="room-item {{ if .IsStarred }}starred{{ end }} {{ if .IsOccupied }}occupied{{ end }}" data-id="{{ .ID }}">
                        <a class="room-item__link" href="/{{ .Slug }}" target="_blank" title="Rediriger vers https://meet.google.com/{{ .SpaceID }}">
                            <div class="room-item__header">
                                <button class="room-item__star" title="{{ if .IsStarred }}Retirer des favoris{{ else }}Ajouter aux favoris{{ end }}">
                                    <span class="room-item__star-icon"></span>
                                </button>
                                <span class="room-item__slug">{{ .Slug }}</span>
                                {{ if gt .ParticipantCount 0 }}
                                <span class="room-item__participant-badge">{{ .ParticipantCount }}</span>
                                {{ end }}
                            </div>
                            <button class="room-item__copy-link" title="Copier le lien">
                                <span class="room-item__copy-icon"></span>Copier le lien
                            </button>
                        </a>
                    </div>
                </li>
                {{ end }}
            </ul>
        </div>
        
        {{ if not .allRooms }}
        <div class="room-list">
            <ul>
                <li>Aucune salle définie</li>
            </ul>
        </div>
        {{ end }}
    </main>
    <script src="/static/js/rooms.js"></script>
</body>
</html>
